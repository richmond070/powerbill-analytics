  # ===========================================================================
  # JOB 7 — Databricks Connectivity Ping
  # Runs on: PRs to main + pushes to main ONLY
  # Needs: bronze-smoke-test passes
  # Uses real credentials from GitHub Secrets — live SELECT 1 call
  # ===========================================================================
  databricks-connectivity:
    name: Databricks Connectivity Ping
    runs-on: ubuntu-latest
    needs: bronze-smoke-test

    # Only run on main branch pushes and PRs targeting main
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requriements.txt

      # Reconstruct databricks/databricks.cfg from GitHub Secrets
      # This mirrors the exact structure of your local databricks/databricks.cfg
      - name: Write databricks.cfg from GitHub Secrets
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT }}
          PG_DB: ${{ secrets.PG_DB }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        run: |
          mkdir -p databricks
          cat > databricks/databricks.cfg << EOF
          [DEFAULT]
          token         = ${DATABRICKS_TOKEN}
          workspace_url = ${DATABRICKS_HOST}
          warehouse_id  = ${DATABRICKS_WAREHOUSE_ID}

          [POSTGRES]
          host     = ${PG_HOST}
          port     = ${PG_PORT:-5432}
          dbname   = ${PG_DB}
          user     = ${PG_USER}
          password = ${PG_PASSWORD}
          EOF
          echo "databricks.cfg written (credentials redacted from log)"

      - name: Validate config structure + Ping Databricks (SELECT 1)
        run: |
          python .github/scripts/check_databricks_connection.py

      # Always clean up — never leave real credentials on the runner
      - name: Remove databricks.cfg from runner
        if: always()
        run: |
          rm -f databricks/databricks.cfg
          echo "Credentials cleaned from runner"
