  #      cache: pip

  #    - name: Install dbt
  #      run: |
  #        pip install --upgrade pip
  #        pip install dbt-core dbt-postgres

  #     - name: Write stub dbt profiles.yml
  #      run: |
  #       mkdir -p ~/.dbt
