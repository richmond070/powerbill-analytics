# profiles.yml
# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANT: This file is in .gitignore — never commit it.
#
# Values are read from environment variables — never hardcoded here.
# Source of truth: databricks/databricks.cfg
#
# Before running any dbt command, load env vars from your cfg:
#   python runners/export_dbt_env.py
#   dbt debug --profiles-dir dbt_project --project-dir dbt_project
#
# Environment variables expected:
#   DATABRICKS_HOST        — workspace URL without https://
#   DATABRICKS_HTTP_PATH   — /sql/1.0/warehouses/<warehouse-id>
#   DATABRICKS_TOKEN       — Personal Access Token (dapi...)
# ─────────────────────────────────────────────────────────────────────────────

energy_pipeline:
  target: dev

  outputs:
    dev:
      type: databricks
      catalog: main
      schema: silver_dev
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
      connect_timeout: 60
      connect_retries: 3

    prod:
      type: databricks
      catalog: main
      schema: silver
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 8
      connect_timeout: 60
      connect_retries: 3
