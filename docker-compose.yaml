version: "3.8"

# =============================================================================
# SHARED AIRFLOW CONFIGURATION
# Applied to init, scheduler, and webserver via YAML anchor.
# Change a value once here — it propagates to all three services.
# =============================================================================
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.0-python3.11

  environment:
    # -------------------------------------------------------------------------
    # Airflow core
    # -------------------------------------------------------------------------
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: "" # set a real key before production

    # -------------------------------------------------------------------------
    # Metadata database
    # Uses airflow_db created automatically by POSTGRES_DB below.
    # -------------------------------------------------------------------------
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://airflow:richard031@postgres/airflow_db

    # -------------------------------------------------------------------------
    # Webserver
    # WEB_SERVER_WORKER_COUNT=1 halves RAM vs the default 4 gunicorn workers.
    # Expose config so you can inspect Airflow settings in the UI.
    # -------------------------------------------------------------------------
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: "energy_pipeline_local_dev"
    AIRFLOW__WEBSERVER__WORKERS: "1"

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO

    # -------------------------------------------------------------------------
    # SMTP alerts (disabled by default — uncomment to enable)
    # -------------------------------------------------------------------------
    # AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
    # AIRFLOW__SMTP__SMTP_PORT: "587"
    # AIRFLOW__SMTP__SMTP_USER: you@gmail.com
    # AIRFLOW__SMTP__SMTP_PASSWORD: yourpassword
    # AIRFLOW__SMTP__SMTP_MAIL_FROM: you@gmail.com

    # =========================================================================
    # PROJECT ENVIRONMENT VARIABLES
    # Read by airflow/config/environment.py, runners/run_bronze.py,
    # and bronze/observer/db_pool.py.
    # Change a path or credential here — all tasks pick it up automatically.
    # =========================================================================

    # --- Project root --------------------------------------------------------
    # All path resolution inside the pipeline uses this as the anchor.
    # Matches the bind mount below: project root → /opt/airflow
    PROJECT_ROOT: /opt/airflow

    # --- Extraction ----------------------------------------------------------
    # api_config.json is read by extraction/runner.run_bronze_ingestion()
    EXTRACTION_API_CONFIG_PATH: /opt/airflow/extraction/api_config.json

    # --- Bronze contract -----------------------------------------------------
    # Written by extraction/runner.py, read by validate_contract task
    # and BronzeLayerOrchestrator
    BRONZE_CONTRACT_PATH: /opt/airflow/bronze/bronze_metadata/bronze_ingestion_contract.json

    # --- Databricks ----------------------------------------------------------
    # Read by bronze/databricks_client.DatabricksSQLClient via configparser
    DATABRICKS_CFG_PATH: /opt/airflow/databricks/databricks.cfg
    DATABRICKS_CATALOG: main
    DATABRICKS_SCHEMA: bronze

    # Staging root for downloaded parquet files (local to the container)
    BRONZE_STAGING_ROOT: /tmp/bronze_staging

    # Delta table root — resolved at SQL execution time on Databricks DBFS
    BRONZE_DELTA_ROOT: /mnt/delta/bronze

    # --- dbt -----------------------------------------------------------------
    # Both point at dbt_project/ — profiles.yml and dbt_project.yml live there
    DBT_PROJECT_DIR: /opt/airflow/dbt_project
    DBT_PROFILES_DIR: /opt/airflow/dbt_project

    # --- Silver --------------------------------------------------------------
    SILVER_CONTRACT_PATH: /opt/airflow/silver/silver_contract.json

    # --- PostgreSQL control plane --------------------------------------------
    # Read by bronze/observer/db_pool.py to build the connection pool.
    # Env var names must match exactly: PG_HOST, PG_PORT, PG_DB, PG_USER, PG_PASSWORD
    PG_HOST: postgres
    PG_PORT: "5432"
    PG_DB: bronze_control
    PG_USER: airflow
    PG_PASSWORD: richard031

    PYTHONPATH: /opt/airflow

  # ---------------------------------------------------------------------------
  # VOLUMES — bind mounts so host edits are live in the container immediately.
  # All paths are relative to the project root (where this file lives).
  # ---------------------------------------------------------------------------
  volumes:
    # Airflow DAGs, logs, plugins
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/requirements.txt:/requirements.txt

    # Project packages — each mounted separately so imports are clean
    - ./bronze:/opt/airflow/bronze
    - ./extraction:/opt/airflow/extraction
    - ./silver:/opt/airflow/silver
    - ./runners:/opt/airflow/runners
    - ./dbt_project:/opt/airflow/dbt_project

    # Data files
    #- ./bronze_metadata:/opt/airflow/bronze/bronze_metadata
    #- ./silver_contract.json:/opt/airflow/silver/silver_contract.json

    # Credentials — gitignored on host, mounted read-only in container
    - ./databricks:/opt/airflow/databricks:ro

  depends_on:
    postgres:
      condition: service_healthy

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # 1. POSTGRES
  #
  #    One container, two logical databases:
  #      airflow_db      → Airflow metadata (DAG runs, task states, XCom)
  #      bronze_control  → Observability (bronze_ingestion_audit + metrics)
  #
  #    postgres:15-alpine: ~80MB RAM vs ~350MB for the default Debian image.
  #    postgres/init_db.sql runs ONCE on first boot and creates bronze_control
  #    plus all observability tables and indexes.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: energy_postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: richard031
      POSTGRES_DB: airflow_db # created automatically by the image entrypoint

    volumes:
      # Persistent named volume — data survives container stop/restart
      - postgres_data:/var/lib/postgresql/data
      # Init script — all *.sql files in postgres/ run once on first boot
      - ./postgres:/docker-entrypoint-initdb.d/

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    ports:
      # Expose for inspection with DBeaver / psql / TablePlus
      - "5432:5432"

    restart: unless-stopped

    # RAM limit — Postgres needs very little for this workload
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # 2. AIRFLOW INIT
  #
  #    One-time setup job. Run with:
  #        docker-compose run --rm airflow-init
  #
  #    Does four things in sequence:
  #      1. Installs Python packages from airflow/requirements.txt
  #      2. Runs Airflow database migrations
  #      3. Creates the admin user (admin / admin)
  #      4. Registers bronze_control as a named Airflow connection
  #         (available in DAGs via BaseHook.get_connection("bronze_control"))
  #
  #    restart: "no" — never restarted automatically after it exits.
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: energy_airflow_init

    command: >
      bash -c "
        echo '=== Installing Python requirements ===' &&
        pip install -r /requirements.txt --quiet --no-cache-dir &&

        echo '=== Running Airflow DB migrations ===' &&
        airflow db migrate &&

        echo '=== Creating admin user ===' &&
        airflow users create \
          --username  admin \
          --password  admin \
          --firstname Admin \
          --lastname  User \
          --role      Admin \
          --email     admin@local.dev \
        || echo 'Admin user already exists — skipping.' &&

        echo '=== Registering bronze_control Airflow connection ===' &&
        airflow connections add bronze_control_postgres \
          --conn-type     postgres \
          --conn-host     postgres \
          --conn-schema   bronze_control \
          --conn-login    airflow \
          --conn-password richard031 \
          --conn-port     5432 \
        || echo 'Connection already exists — skipping.' &&

        echo '=== Init complete ==='
      "

    restart: "no"

  # ---------------------------------------------------------------------------
  # 3. AIRFLOW SCHEDULER
  #
  #    With LocalExecutor the scheduler also runs tasks as subprocesses —
  #    no separate worker container is needed. This is what saves the most RAM.
  #
  #    pip install runs here too so the scheduler has all project dependencies
  #    available when it spawns task subprocesses.
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: energy_airflow_scheduler

    command: >
      bash -c "
        pip install -r /requirements.txt --quiet --no-cache-dir &&
        airflow scheduler
      "

    healthcheck:
      test: >
        ["CMD-SHELL",
         "airflow jobs check --job-type SchedulerJob --hostname $$(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 512M # scheduler + LocalExecutor task subprocesses

  # 4. AIRFLOW WEBSERVER

  airflow-webserver:
    <<: *airflow-common
    container_name: energy_airflow_webserver

    command: >
      bash -c "
        pip install -r /requirements.txt --quiet --no-cache-dir &&
        airflow webserver
      "

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 256M # 1 gunicorn worker + UI assets

# =============================================================================
# VOLUMES
# postgres_data is a named volume — survives container stop/restart/rebuild.
# Everything else uses bind mounts so host edits are live in the container.
# =============================================================================
volumes:
  postgres_data:
    driver: local
