version: "3.8"

# =============================================================================
# SHARED AIRFLOW CONFIGURATION
# YAML anchor — defined once, merged into every airflow-* service via <<:
# =============================================================================
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.0-python3.11

  environment:
    # --- Executor ------------------------------------------------------------
    # LocalExecutor: tasks run as subprocesses inside the scheduler container.
    # Eliminates Redis + Celery worker containers entirely.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    # --- Metadata DB ---------------------------------------------------------
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://airflow:airflow@postgres/airflow_db

    # --- Core behaviour ------------------------------------------------------
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: "UTC"

    # --- Webserver -----------------------------------------------------------
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: "bronze_pipeline_local_secret"

    # --- Logging -------------------------------------------------------------
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO

    # --- SMTP (uncomment and fill to enable email alerts on failure) ---------
    # AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
    # AIRFLOW__SMTP__SMTP_PORT: "587"
    # AIRFLOW__SMTP__SMTP_USER: you@gmail.com
    # AIRFLOW__SMTP__SMTP_PASSWORD: yourpassword
    # AIRFLOW__SMTP__SMTP_MAIL_FROM: you@gmail.com

    # =========================================================================
    # PROJECT-SPECIFIC ENVIRONMENT VARIABLES
    # Every path and config value read by bronze_pipeline_dag.py lives here.
    # Change a value once here — it propagates to all tasks automatically.
    # =========================================================================

    # --- Extraction ----------------------------------------------------------
    # Path to api_config.json inside the container.
    # extraction/ is mounted at /opt/airflow/extraction (see volumes below).
    EXTRACTION_API_CONFIG_PATH: /opt/airflow/extraction/api_config.json

    # --- Contract ------------------------------------------------------------
    # Where finalise_contract writes the finished contract JSON.
    # bronze_metadata/ is mounted at /opt/airflow/bronze_metadata.
    BRONZE_CONTRACT_PATH: /opt/airflow/bronze/bronze_metadata/bronze_ingestion_contract.json

    # --- Databricks ----------------------------------------------------------
    DATABRICKS_CFG_PATH: /opt/airflow/databricks/databricks.cfg
    DATABRICKS_CATALOG: main
    DATABRICKS_SCHEMA: bronze

    # Staging root for parquet files downloaded during ingest phase
    BRONZE_STAGING_ROOT: /tmp/bronze_staging

    # Delta table root — resolved at SQL execution time on Databricks DBFS
    BRONZE_DELTA_ROOT: /mnt/delta/bronze

    # --- DAG schedule --------------------------------------------------------
    # Cron: daily at 01:00 UTC. Override to change frequency.
    BRONZE_PIPELINE_SCHEDULE: "0 1 * * *"

    # --- dbt -----------------------------------------------------------------
    DBT_PROJECT_DIR: /opt/airflow/dbt_project
    DBT_PROFILES_DIR: /opt/airflow/dbt_project

    # --- Observer / control plane --------------------------------------------
    # Connection string used by bronze/observer modules to write audit + metrics
    BRONZE_CONTROL_CONN: postgresql+psycopg2://airflow:airflow@postgres/bronze_control

    # --- Python path ---------------------------------------------------------
    # Makes both packages importable inside the container:
    #   from bronze.ingestion.bronze_orchestrator import BronzeLayerOrchestrator
    #   from extraction.resolver        import HuggingFaceDatasetResolver
    #   from extraction.validator       import ParquetValidator
    # Both bronze/ and extraction/ are mounted under /opt/airflow/
    PYTHONPATH: /opt/airflow

  # ---------------------------------------------------------------------------
  # VOLUMES
  # Bind mounts — edits on your host are immediately live inside the container.
  # ---------------------------------------------------------------------------
  volumes:
    # DAGs: pipeline definitions
    - ./airflow/dags:/opt/airflow/dags

    # Logs: task logs, visible on host for debugging
    - ./airflow/logs:/opt/airflow/logs

    # Plugins: custom operators, hooks, sensors
    - ./airflow/plugins:/opt/airflow/plugins

    # Requirements: installed at container startup
    - ./airflow/requirements.txt:/requirements.txt

    # Extraction module — Phase 1 of the pipeline
    # Importable as: from extraction.resolver import HuggingFaceDatasetResolver
    # Includes api_config.json, resolver.py, runner.py, validator.py
    - ./extraction:/opt/airflow/extraction

    # Bronze module — Phases 2 + 3 of the pipeline
    # Importable as: from bronze.ingestion.bronze_orchestrator import BronzeLayerOrchestrator
    - ./bronze:/opt/airflow/bronze

    # Contract output directory — written by finalise_contract, read by bronze
    - ./bronze/bronze_metadata:/opt/airflow/bronze/bronze_metadata

    # Databricks credentials: workspace_url, token, warehouse_id
    - ./databricks:/opt/airflow/databricks

    # dbt project: models, profiles, packages, dbt_project.yml
    - ./dbt_project:/opt/airflow/dbt_project

    # Runners: manual entry points (run_bronze.py etc.)
    - ./runners:/opt/airflow/runners

  depends_on:
    postgres:
      condition: service_healthy

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # 1. POSTGRES
  #
  #    One container, two logical databases:
  #      airflow_db     → Airflow metadata (DAG runs, task states, XCom)
  #      bronze_control → Bronze observability (audit + metrics tables)
  #
  #    postgres:15-alpine is ~80MB vs ~350MB for the default Debian image.
  #
  #    postgres/init_db.sql runs ONCE on the very first container start:
  #      - Creates bronze_control database
  #      - Creates bronze_ingestion_audit table
  #      - Creates bronze_ingestion_metrics table
  #      - Creates all indexes
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: bronze_postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow_db # Docker creates this automatically

    volumes:
      # Persistent data — survives container stop/start/restart
      - postgres_data:/var/lib/postgresql/data

      # Init script — all *.sql files in this folder run once on first boot
      - ./postgres:/docker-entrypoint-initdb.d/

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    ports:
      # Expose so you can inspect with DBeaver / psql / TablePlus
      - "5432:5432"

    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. AIRFLOW INIT
  #
  #    One-time job:
  #      1. Installs airflow/requirements.txt (providers, dbt, psycopg2, pyarrow)
  #      2. Runs Airflow DB schema migrations
  #      3. Creates the admin user (admin / admin)
  #      4. Registers bronze_control as a named Airflow connection
  #
  #    restart: "no" — never restarted after it exits successfully.
  #    Re-run if needed: docker-compose run --rm airflow-init
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: bronze_airflow_init

    command: >
      bash -c "
        echo '================================================================' &&
        echo 'AIRFLOW INIT — Installing Python requirements' &&
        echo '================================================================' &&
        pip install -r /requirements.txt --quiet --no-cache-dir &&

        echo '================================================================' &&
        echo 'AIRFLOW INIT — Running DB migrations' &&
        echo '================================================================' &&
        airflow db migrate &&

        echo '================================================================' &&
        echo 'AIRFLOW INIT — Creating admin user' &&
        echo '================================================================' &&
        airflow users create \
          --username  admin \
          --password  admin \
          --firstname Admin \
          --lastname  User \
          --role      Admin \
          --email     admin@local.dev \
        || echo 'Admin user already exists — skipping.' &&

        echo '================================================================' &&
        echo 'AIRFLOW INIT — Registering bronze_control Airflow connection' &&
        echo '================================================================' &&
        airflow connections add bronze_control_postgres \
          --conn-type     postgres \
          --conn-host     postgres \
          --conn-schema   bronze_control \
          --conn-login    airflow \
          --conn-password airflow \
          --conn-port     5432 \
        || echo 'Connection already exists — skipping.' &&

        echo '================================================================' &&
        echo 'AIRFLOW INIT — Complete' &&
        echo '================================================================'
      "

    restart: "no"

  # ---------------------------------------------------------------------------
  # 3. AIRFLOW SCHEDULER
  #
  #    Parses DAGs and, with LocalExecutor, also executes tasks as subprocesses.
  #    No separate worker container needed.
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: bronze_airflow_scheduler

    command: >
      bash -c "
        pip install -r /requirements.txt --quiet --no-cache-dir &&
        airflow scheduler
      "

    healthcheck:
      test: >
        ["CMD-SHELL",
         "airflow jobs check --job-type SchedulerJob --hostname $$(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. AIRFLOW WEBSERVER
  #
  #    Serves the Airflow UI.
  #    URL   : http://localhost:8080
  #    Login : admin / admin
  # ---------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: bronze_airflow_webserver

    command: >
      bash -c "
        pip install -r /requirements.txt --quiet --no-cache-dir &&
        airflow webserver
      "

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    restart: unless-stopped

# =============================================================================
# VOLUMES
# postgres_data is a named volume — survives container restarts.
# Everything else uses bind mounts so host edits are live in the container.
# =============================================================================
volumes:
  postgres_data:
    driver: local

# =============================================================================
# FIRST-TIME STARTUP SEQUENCE
# Run from the project root (C:.)
#
# Step 1 — Start Postgres
#           init_db.sql runs here → creates bronze_control + tables
#
#   docker-compose up postgres -d
#   docker-compose logs -f postgres
#   (wait for: "database system is ready to accept connections")
#
# Step 2 — One-time Airflow initialisation
#
#   docker-compose run --rm airflow-init
#
# Step 3 — Start the pipeline services
#
#   docker-compose up airflow-scheduler airflow-webserver -d
#
# Step 4 — Open the UI
#
#   http://localhost:8080   login: admin / admin
#
# Step 5 — Trigger a manual run (optional)
#
#   docker-compose exec airflow-scheduler \
#     airflow dags trigger bronze_pipeline
#
# ─────────────────────────────────────────────────────────────────────────────
# Stop (keeps data):
#   docker-compose down
#
# Full reset (wipes Postgres volume):
#   docker-compose down -v
# ==============================
